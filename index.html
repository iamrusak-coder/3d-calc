<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор 3D-печати</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: rgba(255,255,255,0.4);
            --text: #1c1c1e;
            --button: #007aff;
            --button-text: #ffffff;
            --glass: rgba(255,255,255,0.6);
            --glass-strong: rgba(255,255,255,0.75);
            --border: rgba(255,255,255,0.5);
            --shadow: 0 8px 32px rgba(0,0,0,0.08);
            --radius: 20px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: rgba(28,28,30,0.5);
                --text: #f5f5f7;
                --glass: rgba(255,255,255,0.12);
                --glass-strong: rgba(255,255,255,0.18);
                --border: rgba(255,255,255,0.2);
                --shadow: 0 8px 32px rgba(0,0,0,0.4);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            transition: background 0.3s, color 0.3s;
        }
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: -1;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--glass);
            border-radius: 32px;
            padding: 24px 20px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        h2 { text-align: center; margin-bottom: 24px; font-size: 1.6em; font-weight: 700; }
        .tabs {
            display: flex; gap: 4px; margin-bottom: 24px;
            border-bottom: 2px solid var(--border); flex-wrap: wrap;
        }
        .tab {
            flex: 1 0 auto; text-align: center; padding: 10px 6px; cursor: pointer;
            font-weight: 600; border-bottom: 3px solid transparent;
            transition: 0.2s; font-size: 13px; white-space: nowrap;
            background: transparent; color: var(--text); border-radius: 12px 12px 0 0;
        }
        .tab.active {
            background: var(--glass-strong);
            border-bottom-color: var(--button);
            color: var(--button);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95em; }
        select, input[type="range"], input[type="number"], input[type="text"], input[type="color"] {
            width: 100%; padding: 12px 14px; border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--glass-strong);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text); font-size: 15px;
            transition: all 0.2s; outline: none;
        }
        select:focus, input:focus { border-color: var(--button); box-shadow: 0 0 0 3px rgba(0,122,255,0.2); }
        input[type="range"] {
            padding: 0; height: 8px; background: var(--glass); border-radius: 4px;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: var(--button); border-radius: 50%; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .range-labels { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.7; margin-top: 4px; }
        .result {
            background: var(--glass-strong);
            border-radius: 24px;
            padding: 20px;
            margin: 24px 0;
            line-height: 1.5;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .price { font-size: 28px; font-weight: 700; margin: 10px 0; transition: color 0.3s; }
        button {
            background: var(--glass-strong);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.2s;
        }
        button.primary {
            background: var(--button);
            color: var(--button-text);
            border: none;
        }
        button.danger {
            background: rgba(255,59,48,0.2);
            border-color: rgba(255,59,48,0.4);
            color: #ff3b30;
        }
        button.small { width: auto; padding: 8px 16px; margin: 4px; font-size: 14px; border-radius: 14px; }
        .material-item, .dict-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass);
            padding: 12px; border-radius: 16px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
        }
        .material-info { flex: 1; }
        .material-color {
            display: inline-block; width: 20px; height: 20px;
            border-radius: 50%; margin-right: 10px; vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.2);
        }
        .add-material-form, .dict-form {
            background: var(--glass);
            border-radius: 24px;
            padding: 20px;
            margin-top: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }
        .add-material-form input, .add-material-form select { margin-bottom: 12px; }
        .two-cols { display: flex; gap: 12px; }
        .two-cols > * { flex: 1; }
        .hidden { display: none; }

        .custom-select { position: relative; width: 100%; }
        .custom-select-trigger {
            padding: 12px 14px; border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--glass-strong);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text); font-size: 15px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
        }
        .custom-options {
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            border-radius: 0 0 20px 20px;
            max-height: 240px; overflow-y: auto;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 10; display: none;
        }
        .custom-options.open { display: block; }
        .custom-option {
            padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .custom-option:hover { background: var(--button); color: #fff; }
        .color-dot {
            display: inline-block; width: 20px; height: 20px;
            border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0;
        }
        .sort-btns { margin-bottom: 12px; }
        .sort-btns button { font-size: 13px; padding: 8px 14px; margin: 0; }
        #ralSearchBlock {
            background: var(--glass); border-radius: 16px; padding: 14px; margin-top: 10px;
        }
        #ralCodeInput { width: 100%; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <h2>🧮 Расчёт 3D-печати</h2>

        <div class="tabs">
            <div class="tab active" data-tab="calc">📊 Расчёт</div>
            <div class="tab" data-tab="materials">🎨 Материалы</div>
            <div class="tab" data-tab="settings">⚙️ Настройки</div>
            <div class="tab" data-tab="dictionaries">📋 Справочники</div>
        </div>

        <div class="tab-panel active" id="panel-calc">
            <div class="form-group">
                <label>Название модели / заказа</label>
                <input type="text" id="modelName" placeholder="например, Кронштейн v2">
            </div>
            <div class="form-group">
                <label>Материал:</label>
                <div class="custom-select" id="materialCustomSelect">
                    <div class="custom-select-trigger" id="materialTrigger">
                        <span class="color-dot" style="background:#ccc;"></span>
                        <span id="materialTriggerText">Выберите материал</span>
                    </div>
                    <div class="custom-options" id="materialOptions"></div>
                </div>
            </div>
            <div class="form-group">
                <label>Вес (г): <span id="weightValue">100</span> г</label>
                <input type="range" id="weight" min="1" max="2000" value="100" step="1">
                <div class="range-labels"><span>1</span><span>2000</span></div>
            </div>
            <div class="form-group">
                <label>Время (ч): <span id="timeValue">4.0</span> ч</label>
                <input type="range" id="time" min="0.5" max="48" value="4" step="0.5">
                <div class="range-labels"><span>0.5</span><span>48</span></div>
            </div>
            <div class="form-group">
                <label>Наценка:</label>
                <select id="marginSelect">
                    <option value="1.0">×1.0 (без наценки)</option>
                    <option value="1.2" selected>×1.2 (+20%)</option>
                    <option value="1.5">×1.5 (+50%)</option>
                    <option value="2.0">×2.0 (+100%)</option>
                </select>
            </div>
            <div class="result" id="result"></div>
            <button id="sendBtn" class="primary">📤 Отправить расчёт в чат</button>
            <button id="shareBtn">📋 Поделиться</button>
        </div>

        <div class="tab-panel" id="panel-materials">
            <h3>🎨 Список материалов</h3>
            <div class="sort-btns">
                <button id="sortByType" class="small">По типу</button>
            </div>
            <div id="materialsList"></div>
            <button id="showAddMaterial" class="primary">➕ Добавить материал</button>
            <div class="add-material-form" id="addMaterialForm" style="display:none;">
                <div class="form-group">
                    <label>Бренд</label>
                    <select id="brandSelect"></select>
                    <input type="text" id="newBrandOther" class="hidden" placeholder="Введите бренд">
                </div>
                <div class="form-group">
                    <label>Тип</label>
                    <select id="typeSelect"></select>
                    <input type="text" id="newTypeOther" class="hidden" placeholder="Введите тип">
                </div>
                <div class="form-group">
                    <label>Серия (опционально)</label>
                    <input type="text" id="newSeries" placeholder="Pro, Silk, Easy...">
                </div>
                <div class="form-group">
                    <label>Цвет</label>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <input type="color" id="newColorPicker" value="#ff0000" style="width:60px; padding:0;">
                        <input type="text" id="newColorText" placeholder="Название или HEX" style="flex:1;">
                        <button type="button" class="small" id="ralBtn">🎨 RAL</button>
                    </div>
                    <div id="ralSearchBlock" class="hidden">
                        <label>Введите код RAL (например, 4005)</label>
                        <input type="text" id="ralCodeInput" placeholder="4005">
                        <button class="small" id="ralSearchBtn">Найти</button>
                        <div id="ralResult" style="margin-top:6px;"></div>
                    </div>
                </div>
                <div class="two-cols">
                    <div class="form-group">
                        <label>Цена за упак. (Br)</label>
                        <input type="number" id="newPrice" step="0.01" min="0" value="30">
                    </div>
                    <div class="form-group">
                        <label>Вес упак. (г)</label>
                        <input type="number" id="newWeight" step="1" min="1" value="1000">
                    </div>
                </div>
                <button id="saveNewMaterial" class="primary">💾 Сохранить</button>
                <button id="cancelAddMaterial" class="danger">Отмена</button>
            </div>
        </div>

        <div class="tab-panel" id="panel-settings">
            <h3>🔧 Глобальные параметры</h3>
            <div class="form-group">
                <label>Мощность принтера (кВт)</label>
                <input type="number" id="powerInput" step="0.01" min="0" value="0.15">
            </div>
            <div class="form-group">
                <label>Тариф за электричество (Br/кВт·ч)</label>
                <input type="number" id="tariffInput" step="0.01" min="0" value="0.25">
            </div>
            <div class="form-group">
                <label>Амортизация (Br/час)</label>
                <input type="number" id="amortInput" step="0.1" min="0" value="10.0">
            </div>
            <p style="font-size:0.9em; opacity:0.8; margin: 20px 0;">Все суммы в белорусских рублях (Br).</p>
            <button id="resetSettings" class="danger">🔄 Сбросить настройки</button>
        </div>

        <div class="tab-panel" id="panel-dictionaries">
            <h3>📋 Редактирование справочников</h3>
            <div class="form-group">
                <label>Бренды</label>
                <div id="brandsList"></div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <input type="text" id="newBrandInput" placeholder="Новый бренд">
                    <button id="addBrandBtn" class="small">Добавить</button>
                </div>
            </div>
            <div class="form-group">
                <label>Типы пластика</label>
                <div id="typesList"></div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <input type="text" id="newTypeInput" placeholder="Новый тип">
                    <button id="addTypeBtn" class="small">Добавить</button>
                </div>
            </div>
        </div>
    </div>

        const colorList = Object.entries(colorNamesMap).map(([name, hex]) => {
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            return {name, hex, r, g, b};

        function findClosestColorName(hex) {
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            let minDist = Infinity, closest = '';
            for (let c of colorList) {
                const dr = r - c.r, dg = g - c.g, db = b - c.b;
                const dist = dr*dr + dg*dg + db*db;
                if (dist < minDist) { minDist = dist; closest = c.name; }
            }
            return closest;
        }

        function getColorName(mat) {

                        <button class="edit-material small" data-index="${index}">✏️</button>
                        <button class="delete-material small danger" data-index="${index}">🗑️</button>
                    </div>`;
                materialsListDiv.appendChild(div);
            });
            document.querySelectorAll('.delete-material').forEach(b => {
                b.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    settings.materials.splice(idx,1);
                    saveSettings(settings);
                    renderMaterialsList();
                    updateCustomMaterialSelect();
                });
            });
            document.querySelectorAll('.edit-material').forEach(b => {
                b.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    const m = settings.materials[idx];
                    if (customBrands.includes(m.brand)) {
                        brandSelect.value = m.brand;
                        newBrandOther.classList.add('hidden');
                    } else {
                        brandSelect.value = 'other';
                        newBrandOther.classList.remove('hidden');
                        newBrandOther.value = m.brand;
                    }
                    if (customTypes.includes(m.type)) {
                        typeSelect.value = m.type;
                        newTypeOther.classList.add('hidden');
                    } else {
                        typeSelect.value = 'other';
                        newTypeOther.classList.remove('hidden');
                        newTypeOther.value = m.type;
                    }
                    newSeries.value = m.series || '';
                    newColorPicker.value = m.color || '#ff0000';
                    newColorText.value = m.color || '';
                    newPrice.value = m.pricePerPackage;
                    newWeight.value = m.packageWeight;
                    addMaterialForm.style.display = 'block';
                    addMaterialForm.dataset.editIndex = idx;
                });
            });
        }

        function saveMaterial() {
            let brand = brandSelect.value;
            if (brand === 'other') brand = newBrandOther.value.trim();
            let type = typeSelect.value;
            if (type === 'other') type = newTypeOther.value.trim();
            const series = newSeries.value.trim();
            const color = newColorText.value.trim() || newColorPicker.value;
            const price = parseFloat(newPrice.value);
            const weight = parseFloat(newWeight.value);
            if (!brand || !type || isNaN(price) || price<=0 || isNaN(weight) || weight<=0) {
                alert('Заполните бренд, тип, цену и вес корректно.');
                return;
            }
            const material = { brand, type, series, color, pricePerPackage: price, packageWeight: weight };
            const editIdx = addMaterialForm.dataset.editIndex;
            if (editIdx !== undefined && editIdx !== '') {
                settings.materials[editIdx] = material;
            } else {
                settings.materials.push(material);
                incrementUsage('brandUsage', brand);
                brandUsage = getUsage('brandUsage');
                incrementUsage('typeUsage', type);
                typeUsage = getUsage('typeUsage');
                if (!customBrands.includes(brand)) {
                    customBrands.push(brand);
                    saveBrands();
                }
                if (!customTypes.includes(type)) {
                    customTypes.push(type);
                    saveTypes();
                }
                populateBrandSelect();
                populateTypeSelect();
            }
            saveSettings(settings);
            brandSelect.value = ''; newBrandOther.classList.add('hidden'); newBrandOther.value='';
            typeSelect.value = ''; newTypeOther.classList.add('hidden'); newTypeOther.value='';
            newSeries.value = ''; newColorPicker.value = '#ff0000'; newColorText.value = '';
            newPrice.value = '30'; newWeight.value = '1000';
            addMaterialForm.style.display = 'none';
            delete addMaterialForm.dataset.editIndex;
            renderMaterialsList();
            updateCustomMaterialSelect();
        }

        function recalculate() {
            if (selectedMaterialIndex === null || settings.materials.length === 0) {
                resultDiv.innerHTML = '<p>Добавьте материалы во вкладке «🎨 Материалы».</p>';
                return;
            }
            const mat = settings.materials[selectedMaterialIndex];
            if (!mat) return;
            const weight = parseFloat(weightInput.value);
            const time = parseFloat(timeInput.value);
            const margin = parseFloat(marginSelect.value);
            const ppg = mat.pricePerPackage / mat.packageWeight;
            const plasticCost = weight * ppg;
            const electricityCost = settings.power * time * settings.tariff;
            const amortization = settings.amortization * time;
            const costPrice = plasticCost + electricityCost + amortization;
            const finalPrice = costPrice * margin;

            weightValue.textContent = weight;
            timeValue.textContent = time.toFixed(1);
            const colorName = getColorName(mat);

            let priceColor;
            if (margin <= 1.0) priceColor = '#34c759';
            else if (margin <= 1.2) priceColor = '#ffcc00';
            else if (margin <= 1.5) priceColor = '#ff9500';
            else priceColor = '#ff3b30';

            resultDiv.innerHTML = `
                <strong>📊 Детали расчёта</strong><br>
                ▪ Материал: ${mat.brand} ${mat.type} ${mat.series} (${colorName}) (${ppg.toFixed(3)} Br/г)<br>
                ▪ Вес: ${weight} г → ${plasticCost.toFixed(2)} Br<br>
                ▪ Время: ${time.toFixed(1)} ч<br>
                ▪ Электричество: ${electricityCost.toFixed(2)} Br<br>
                ▪ Амортизация: ${amortization.toFixed(2)} Br<br>
                ▪ Себестоимость: ${costPrice.toFixed(2)} Br<br>
                <div class="price" style="color:${priceColor}">💰 Итого: ${finalPrice.toFixed(2)} Br</div>`;
            resultDiv.dataset.finalPrice = finalPrice.toFixed(2);
            resultDiv.dataset.costPrice = costPrice.toFixed(2);
        }

        function generateShareText() {
            const modelName = modelNameInput.value.trim() || 'Без названия';
            const mat = settings.materials[selectedMaterialIndex];
            if (!mat) return '';
            const ppg = (mat.pricePerPackage / mat.packageWeight).toFixed(3);
            const weight = weightInput.value;
            const time = timeInput.value;
            const costPrice = resultDiv.dataset.costPrice;
            const finalPrice = resultDiv.dataset.finalPrice;
            return `📊 Расчёт 3D-печати: ${modelName}\n` +
                   `▪ Материал: ${mat.brand} ${mat.type} ${mat.series} (${getColorName(mat)}) ≈${ppg} Br/г\n` +
                   `▪ Вес: ${weight} г\n` +
                   `▪ Время печати: ${time} ч\n` +
                   `💰 Итого к оплате: ${finalPrice} Br`;
        }

        sendBtn.addEventListener('click', () => {
            if (!tg?.sendData) { alert('Только внутри Telegram'); return; }
            if (selectedMaterialIndex === null) return;
            const mat = settings.materials[selectedMaterialIndex];
            const modelName = modelNameInput.value.trim() || 'Без названия';
            const data = {
                model: modelName,
                material: `${mat.brand} ${mat.type} ${mat.series}`,
                color: getColorName(mat),
                weight: weightInput.value,
                time: timeInput.value,
                margin: marginSelect.value,
                final_price: resultDiv.dataset.finalPrice + ' Br'
            };
            tg.sendData(JSON.stringify(data));
            tg.showPopup({ title: 'Готово', message: `Расчёт "${modelName}" отправлен.` });
        });

        shareBtn.addEventListener('click', async () => {
            const text = generateShareText();
            if (navigator.share) {
                try {
                    await navigator.share({ title: 'Расчёт 3D-печати', text: text });
                } catch (e) {}
            } else {
                try {
                    await navigator.clipboard.writeText(text);
                    alert('Расчёт скопирован в буфер обмена.');
                } catch (e) {
                    alert('Не удалось поделиться.');
                }
            }
        });

        function loadGlobalParamsToForm() {
            powerInput.value = settings.power;
            tariffInput.value = settings.tariff;
            amortInput.value = settings.amortization;
        }
        function saveGlobalParams() {
            settings.power = parseFloat(powerInput.value) || 0.15;
            settings.tariff = parseFloat(tariffInput.value) || 0.25;
            settings.amortization = parseFloat(amortInput.value) || 10.0;
            saveSettings(settings);
            recalculate();
        }
        [powerInput, tariffInput, amortInput].forEach(inp => inp.addEventListener('change', saveGlobalParams));

        resetSettingsBtn.addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите сбросить все настройки и материалы к заводским?')) {
                localStorage.removeItem('printCalcSettings');
                localStorage.removeItem('customBrands');
                localStorage.removeItem('customTypes');
                localStorage.removeItem('brandUsage');
                localStorage.removeItem('typeUsage');
                customBrands = [...DEFAULT_BRANDS];
                customTypes = [...DEFAULT_TYPES];
                brandUsage = {};
                typeUsage = {};
                saveBrands();
                saveTypes();
                settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
                saveSettings(settings);
                loadGlobalParamsToForm();
                renderBrandsList();
                renderTypesList();
                populateBrandSelect();
                populateTypeSelect();
                updateCustomMaterialSelect();
                renderMaterialsList();
                recalculate();
                alert('Настройки сброшены.');
            }
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                const panel = document.getElementById('panel-' + tab.dataset.tab);
                panel.classList.add('active');
                if (tab.dataset.tab === 'materials') renderMaterialsList();
                if (tab.dataset.tab === 'settings') loadGlobalParamsToForm();
                if (tab.dataset.tab === 'dictionaries') {
                    renderBrandsList();
                    renderTypesList();
                }
            });
        });

        document.getElementById('showAddMaterial').addEventListener('click', () => {
            populateBrandSelect();
            populateTypeSelect();
            addMaterialForm.style.display = 'block';
            delete addMaterialForm.dataset.editIndex;
            brandSelect.value = ''; newBrandOther.classList.add('hidden'); newBrandOther.value = '';
            typeSelect.value = ''; newTypeOther.classList.add('hidden'); newTypeOther.value = '';
            newSeries.value = ''; newColorPicker.value = '#ff0000'; newColorText.value = '';
            newPrice.value = '30'; newWeight.value = '1000';
            ralSearchBlock.classList.add('hidden');
        });

        document.getElementById('saveNewMaterial').addEventListener('click', saveMaterial);
        document.getElementById('cancelAddMaterial').addEventListener('click', () => {
            addMaterialForm.style.display = 'none';
            delete addMaterialForm.dataset.editIndex;
        });

        document.getElementById('addBrandBtn').addEventListener('click', () => {
            const newBrand = document.getElementById('newBrandInput').value.trim();
            if (newBrand && !customBrands.includes(newBrand)) {
                customBrands.push(newBrand);
                saveBrands();
                renderBrandsList();
                populateBrandSelect();
                document.getElementById('newBrandInput').value = '';
            }
        });
        document.getElementById('addTypeBtn').addEventListener('click', () => {
            const newType = document.getElementById('newTypeInput').value.trim();
            if (newType && !customTypes.includes(newType)) {
                customTypes.push(newType);
                saveTypes();
                renderTypesList();
                populateTypeSelect();
                document.getElementById('newTypeInput').value = '';
            }
        });

        document.getElementById('sortByType').addEventListener('click', sortByType);

        weightInput.addEventListener('input', recalculate);
        timeInput.addEventListener('input', recalculate);
        marginSelect.addEventListener('change', recalculate);

        populateBrandSelect();
        populateTypeSelect();
        updateCustomMaterialSelect();
        recalculate();
    </script>
</body>
</html>
