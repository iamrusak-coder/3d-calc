<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Калькулятор 3D-печати</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: rgba(255,255,255,0.25);
            --text: #1c1c1e;
            --button: #007aff;
            --button-text: #ffffff;
            --glass: rgba(255,255,255,0.5);
            --glass-strong: rgba(255,255,255,0.7);
            --border: rgba(255,255,255,0.4);
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
            --radius: 24px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: rgba(28,28,30,0.35);
                --text: #f5f5f7;
                --glass: rgba(255,255,255,0.12);
                --glass-strong: rgba(255,255,255,0.2);
                --border: rgba(255,255,255,0.25);
                --shadow: 0 8px 32px rgba(0,0,0,0.4);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
        }
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: -2;
        }
        .app-container {
            display: flex; flex-direction: column; height: 100%;
            max-width: 600px; margin: 0 auto;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0;
        }
        .header h2 { font-size: 1.8em; font-weight: 700; }
        .tabs {
            display: flex; gap: 4px; margin-bottom: 12px;
            border-bottom: 2px solid var(--border); flex-wrap: wrap;
        }
        .tab {
            flex: 1 0 auto; text-align: center; padding: 10px 4px; cursor: pointer;
            font-weight: 600; border-bottom: 3px solid transparent;
            transition: 0.2s; font-size: 14px; white-space: nowrap;
            background: transparent; color: var(--text); border-radius: 12px 12px 0 0;
        }
        .tab.active {
            background: var(--glass-strong);
            border-bottom-color: var(--button);
            color: var(--button);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .tab-content {
            flex: 1; overflow-y: auto; padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }
        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95em; }
        select, input[type="range"], input[type="number"], input[type="text"], input[type="color"] {
            width: 100%; padding: 12px 14px; border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--glass-strong);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text); font-size: 15px;
            transition: all 0.2s; outline: none;
        }
        select:focus, input:focus { border-color: var(--button); box-shadow: 0 0 0 3px rgba(0,122,255,0.2); }
        input[type="range"] {
            padding: 0; height: 8px; background: var(--glass); border-radius: 4px;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: var(--button); border-radius: 50%; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .range-labels { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.7; margin-top: 4px; }

        .glass-card {
            background: var(--glass);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .glass-card.light { background: var(--glass-strong); }

        .price { font-size: 28px; font-weight: 700; margin: 10px 0; transition: color 0.3s; }

        button {
            background: var(--glass-strong);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 20px;
            font-size: 16px; font-weight: 600; width: 100%; margin: 8px 0;
            cursor: pointer;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.2s;
        }
        button.primary { background: var(--button); color: var(--button-text); border: none; }
        button.danger { background: rgba(255,59,48,0.2); border-color: rgba(255,59,48,0.4); color: #ff3b30; }
        button.small { width: auto; padding: 8px 14px; margin: 2px; font-size: 14px; border-radius: 14px; }

        .parts-list { margin-bottom: 16px; }
        .part-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass); padding: 10px; border-radius: 14px;
            margin-bottom: 8px; flex-wrap: wrap;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }
        .part-item .part-info { flex: 1; }
        .color-dot {
            display: inline-block; width: 18px; height: 18px;
            border-radius: 50%; margin-right: 8px; vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .archive-item {
            background: var(--glass); border-radius: 16px; padding: 12px;
            margin-bottom: 10px; border: 1px solid var(--border);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            cursor: pointer; transition: background 0.2s;
        }
        .archive-item:hover { background: var(--glass-strong); }

        .custom-select { position: relative; width: 100%; }
        .custom-select-trigger {
            padding: 12px 14px; border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--glass-strong);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text); font-size: 15px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
        }
        .custom-options {
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            border-radius: 0 0 20px 20px;
            max-height: 200px; overflow-y: auto;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 20; display: none;
        }
        .custom-options.open { display: block; }
        .custom-option {
            padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .custom-option:hover { background: var(--button); color: #fff; }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="app-container">
        <div class="header">
            <h2>🧮 3D‑Печать</h2>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="calc">📊 Расчёт</div>
            <div class="tab" data-tab="materials">🎨 Материалы</div>
            <div class="tab" data-tab="archive">📦 Архив</div>
            <div class="tab" data-tab="settings">⚙️ Настройки</div>
            <div class="tab" data-tab="dictionaries">📋 Справочники</div>
        </div>

        <div class="tab-content">
            <!-- Расчёт -->
            <div class="tab-panel active" id="panel-calc">
                <div class="form-group">
                    <label>Название заказа</label>
                    <input type="text" id="modelName" placeholder="например, Корпус устройства">
                </div>

                <div class="glass-card light">
                    <label>Детали заказа (можно несколько)</label>
                    <div class="parts-list" id="partsList"></div>
                    <button id="addPartBtn" class="small">➕ Добавить деталь</button>
                </div>

                <div class="form-group">
                    <label>Общая наценка:</label>
                    <select id="marginSelect">
                        <option value="1.0">×1.0 (без наценки)</option>
                        <option value="1.2" selected>×1.2 (+20%)</option>
                        <option value="1.5">×1.5 (+50%)</option>
                        <option value="2.0">×2.0 (+100%)</option>
                    </select>
                </div>

                <div class="glass-card" id="resultBlock">
                    <div id="result"></div>
                </div>

                <button id="sendBtn" class="primary">📤 Отправить в чат</button>
                <button id="shareBtn">📋 Поделиться</button>
            </div>

            <!-- Материалы -->
            <div class="tab-panel" id="panel-materials">
                <h3>🎨 Список материалов</h3>
                <div class="sort-btns" style="margin-bottom:12px;">
                    <button id="sortByType" class="small">По типу</button>
                </div>
                <div id="materialsList"></div>
                <button id="showAddMaterial" class="primary">➕ Добавить материал</button>
                <div class="glass-card" id="addMaterialForm" style="display:none;">
                    <div class="form-group">
                        <label>Бренд</label>
                        <select id="brandSelect"></select>
                        <input type="text" id="newBrandOther" class="hidden" placeholder="Введите бренд">
                    </div>
                    <div class="form-group">
                        <label>Тип</label>
                        <select id="typeSelect"></select>
                        <input type="text" id="newTypeOther" class="hidden" placeholder="Введите тип">
                    </div>
                    <div class="form-group">
                        <label>Серия (опционально)</label>
                        <input type="text" id="newSeries" placeholder="Pro, Silk, Easy...">
                    </div>
                    <div class="form-group">
                        <label>Цвет</label>
                        <div style="display:flex; gap:10px; align-items:center;">
                            <input type="color" id="newColorPicker" value="#ff0000" style="width:60px; padding:0;">
                            <input type="text" id="newColorText" placeholder="Название или HEX" style="flex:1;">
                            <button type="button" class="small" id="ralBtn">🎨 RAL</button>
                        </div>
                        <div id="ralSearchBlock" class="hidden glass-card" style="margin-top:8px;">
                            <label>Введите код RAL (например, 4005)</label>
                            <input type="text" id="ralCodeInput" placeholder="4005">
                            <button class="small" id="ralSearchBtn">Найти</button>
                            <div id="ralResult" style="margin-top:6px;"></div>
                        </div>
                    </div>
                    <div class="two-cols" style="display:flex; gap:12px;">
                        <div class="form-group" style="flex:1;">
                            <label>Цена за упак. (Br)</label>
                            <input type="number" id="newPrice" step="0.01" min="0" value="30">
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label>Вес упак. (г)</label>
                            <input type="number" id="newWeight" step="1" min="1" value="1000">
                        </div>
                    </div>
                    <button id="saveNewMaterial" class="primary">💾 Сохранить</button>
                    <button id="cancelAddMaterial" class="danger">Отмена</button>
                </div>
            </div>

            <!-- Архив -->
            <div class="tab-panel" id="panel-archive">
                <h3>📦 Архив заказов</h3>
                <div id="archiveList"></div>
            </div>

            <!-- Настройки -->
            <div class="tab-panel" id="panel-settings">
                <h3>🔧 Глобальные параметры</h3>
                <div class="form-group">
                    <label>Мощность принтера (кВт)</label>
                    <input type="number" id="powerInput" step="0.01" min="0" value="0.15">
                </div>
                <div class="form-group">
                    <label>Тариф за электричество (Br/кВт·ч)</label>
                    <input type="number" id="tariffInput" step="0.01" min="0" value="0.25">
                </div>
                <div class="form-group">
                    <label>Амортизация (Br/час)</label>
                    <input type="number" id="amortInput" step="0.1" min="0" value="10.0">
                </div>
                <button id="resetSettings" class="danger">🔄 Сбросить настройки</button>
            </div>

            <!-- Справочники -->
            <div class="tab-panel" id="panel-dictionaries">
                <h3>📋 Справочники</h3>
                <div class="form-group">
                    <label>Бренды</label>
                    <div id="brandsList"></div>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <input type="text" id="newBrandInput" placeholder="Новый бренд">
                        <button id="addBrandBtn" class="small">Добавить</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Типы пластика</label>
                    <div id="typesList"></div>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <input type="text" id="newTypeInput" placeholder="Новый тип">
                        <button id="addTypeBtn" class="small">Добавить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

            "коралловый":"#ff7f50","персиковый":"#ffdab9","лавандовый":"#e6e6fa"
        };
        const colorList = Object.entries(colorNamesMap).map(([name, hex]) => {
            const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            return {name, hex, r, g, b};
        });
        function findClosestColorName(hex) {
            const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            let minDist = Infinity, closest = '';
            for (let c of colorList) {
                const dr = r-c.r, dg = g-c.g, db = b-c.b;
                const dist = dr*dr + dg*dg + db*db;
                if (dist < minDist) { minDist = dist; closest = c.name; }
            }
            return closest;
        }
        function getColorName(mat) {
            if (!mat || !mat.color) return 'нет';
            if (mat.color.startsWith('#')) return findClosestColorName(mat.color);
            return mat.color;
        }

        function updateMaterialSelectForPart(selectElement, selectedIndex) {
            selectElement.innerHTML = '';
            settings.materials.forEach((mat, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                const ppg = (mat.pricePerPackage / mat.packageWeight).toFixed(3);
                opt.textContent = `${mat.brand} ${mat.type}${mat.series?' '+mat.series:''} — ${ppg} Br/г (${getColorName(mat)})`;
                selectElement.appendChild(opt);
            });
            selectElement.value = selectedIndex;
        }

        function renderParts() {
            partsListDiv.innerHTML = '';
            currentOrder.parts.forEach((part, idx) => {
                const mat = settings.materials[part.materialIndex] || settings.materials[0];
                const ppg = (mat.pricePerPackage / mat.packageWeight).toFixed(3);
                const div = document.createElement('div');
                div.className = 'part-item';
                div.innerHTML = `
                    <div class="part-info">
                        <span class="color-dot" style="background:${mat.color||'#ccc'}"></span>
                        <strong>${mat.brand} ${mat.type}</strong> (${getColorName(mat)})<br>
                        <small>Вес: ${part.weight} г, Время: ${part.time} ч, Цена: ${(part.weight * mat.pricePerPackage / mat.packageWeight).toFixed(2)} Br</small>
                    </div>

                        <button class="delete-part small danger" data-index="${idx}">🗑️</button>

                    if (currentOrder.parts.length === 0) {
                        currentOrder.parts.push({ materialIndex: 0, weight: 100, time: 4.0 });
                    }
                    renderParts();
                    recalculate();
                });
            });

        function recalculate() {
            if (settings.materials.length === 0 || currentOrder.parts.length === 0) {
                resultDiv.innerHTML = '<p>Добавьте материалы и детали.</p>';
                return;
            }
            const margin = parseFloat(marginSelect.value);
            let totalCost = 0;
            const details = [];
            currentOrder.parts.forEach((part, idx) => {
                const mat = settings.materials[part.materialIndex];
                if (!mat) return;
                const ppg = mat.pricePerPackage / mat.packageWeight;
                const plasticCost = part.weight * ppg;
                const electricityCost = settings.power * part.time * settings.tariff;
                const amortization = settings.amortization * part.time;
                const partCost = plasticCost + electricityCost + amortization;
                totalCost += partCost;
                details.push({ idx, mat, ppg, plasticCost, electricityCost, amortization, partCost, weight: part.weight, time: part.time });
            });
            const finalPrice = totalCost * margin;

            let detailsHtml = details.map(d => `
                <div style="margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--border);">
                    <span class="color-dot" style="background:${d.mat.color||'#ccc'}"></span>
                    ${d.mat.brand} ${d.mat.type} — ${d.weight} г, ${d.time} ч = ${d.partCost.toFixed(2)} Br
                </div>
            `).join('');

            let priceColor;
            if (margin <= 1.0) priceColor = '#34c759';
            else if (margin <= 1.2) priceColor = '#ffcc00';
            else if (margin <= 1.5) priceColor = '#ff9500';
            else priceColor = '#ff3b30';

            resultDiv.innerHTML = `
                <div style="font-size:0.9em; opacity:0.8; margin-bottom:8px;">${detailsHtml}</div>
                <div class="price" style="color:${priceColor}">💰 Итого: ${finalPrice.toFixed(2)} Br</div>
            `;
            resultDiv.dataset.finalPrice = finalPrice.toFixed(2);
            resultDiv.dataset.totalCost = totalCost.toFixed(2);
        }

            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
                if (tab.dataset.tab === 'archive') loadArchive();
                if (tab.dataset.tab === 'materials') renderMaterials();
                if (tab.dataset.tab === 'dictionaries') { renderBrands(); renderTypes(); }
            });
        });

        renderParts();
        recalculate();
        loadArchive();
    </script>
</body>
</html>
