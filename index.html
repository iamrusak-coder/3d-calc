<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Калькулятор 3D-печати</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: rgba(255,255,255,0.15);
            --text: #1c1c1e;
            --button: #007aff;
            --button-text: #ffffff;
            --glass: rgba(255,255,255,0.45);
            --glass-strong: rgba(255,255,255,0.65);
            --border: rgba(255,255,255,0.4);
            --shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: rgba(28,28,30,0.3);
                --text: #f5f5f7;
                --glass: rgba(255,255,255,0.08);
                --glass-strong: rgba(255,255,255,0.14);
                --border: rgba(255,255,255,0.15);
                --shadow: 0 8px 32px rgba(0,0,0,0.4);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px) 12px;
            touch-action: none;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--glass);
            border-radius: 32px;
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .tabs-header {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            padding: 16px 16px 0;
            flex-shrink: 0;
            background: var(--glass-strong);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .tab {
            flex: 1 0 auto;
            text-align: center;
            padding: 10px 6px;
            cursor: pointer;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
            font-size: 13px;
            white-space: nowrap;
            background: transparent;
            color: var(--text);
            border-radius: 12px 12px 0 0;
        }
        .tab.active {
            background: var(--button);
            color: var(--button-text);
            border-bottom-color: var(--button);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 20px 18px 24px;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        h2 { text-align: center; margin-bottom: 20px; font-size: 1.5em; font-weight: 700; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95em; }
        select, input[type="number"], input[type="text"], input[type="color"] {
            width: 100%; padding: 12px 14px; border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--glass-strong);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            color: var(--text); font-size: 15px;
            transition: all 0.2s; outline: none;
        }
        select:focus, input:focus { border-color: var(--button); box-shadow: 0 0 0 3px rgba(0,122,255,0.2); }

        button {
            background: var(--glass-strong);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px; border-radius: 20px;
            font-size: 16px; font-weight: 600;
            width: 100%; margin: 8px 0;
            cursor: pointer;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: all 0.2s;
        }
        button.primary { background: var(--button); color: var(--button-text); border: none; }
        button.danger { background: rgba(255,59,48,0.2); border-color: rgba(255,59,48,0.4); color: #ff3b30; }
        button.small { width: auto; padding: 8px 16px; margin: 4px; font-size: 14px; border-radius: 14px; }

        .material-item, .dict-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass); padding: 12px; border-radius: 16px;
            margin-bottom: 10px; flex-wrap: wrap;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
        }
        .two-cols { display: flex; gap: 12px; }
        .two-cols > * { flex: 1; }
        .hidden { display: none; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.hidden { display: none; }
        .modal-content {
            background: var(--glass-strong);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 28px; padding: 24px;
            width: 90%; max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            color: var(--text);
        }
        .modal-content h3 { margin-bottom: 16px; font-size: 1.3em; }
        .modal-content .form-group { margin-bottom: 14px; }
        .modal-content select, .modal-content input {
            background: var(--glass);
            border: 1px solid var(--border);
        }
        input[type="range"] {
            width: 100%; padding: 0; height: 8px; background: var(--glass); border-radius: 4px;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: var(--button); border-radius: 50%; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .part-card {
            background: var(--glass); border-radius: 20px; padding: 16px;
            margin-bottom: 16px; border: 1px solid var(--border);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        .part-card h4 { margin-bottom: 8px; font-size: 1.1em; }
        .detail-row { display: flex; justify-content: space-between; margin: 4px 0; }
        .summary-block { background: var(--glass-strong); border-radius: 20px; padding: 16px; margin-top: 16px; }
        .summary-block hr { border: 0.5px solid var(--border); margin: 12px 0; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="tabs-header">
            <div class="tab active" data-tab="calc">📊 Расчёт</div>
            <div class="tab" data-tab="materials">🎨 Материалы</div>
            <div class="tab" data-tab="settings">⚙️ Настройки</div>
            <div class="tab" data-tab="dictionaries">📋 Справочники</div>
        </div>
        <div class="tab-content">
            <div class="tab-panel active" id="panel-calc">
                <div class="form-group">
                    <label>Название заказа</label>
                    <input type="text" id="orderName" placeholder="например, Кронштейн v2">
                </div>
                <button id="addPartBtn" class="primary">➕ Добавить деталь</button>
                <div id="partsContainer" class="parts-list"></div>
                <div class="form-group" style="margin-top:20px;">
                    <label>Наценка на заказ</label>
                    <select id="marginSelect">
                        <option value="1.0">×1.0 (без наценки)</option>
                        <option value="1.2" selected>×1.2 (+20%)</option>
                        <option value="1.5">×1.5 (+50%)</option>
                        <option value="2.0">×2.0 (+100%)</option>
                    </select>
                </div>
                <div class="result" id="result"></div>
                <button id="shareBtn">📋 Поделиться</button>
                <button id="saveOrderBtn">💾 Сохранить заказ</button>
                <button id="loadOrderBtn">📂 Загрузить из архива</button>
                <div id="archiveList" class="hidden" style="margin-top:16px;"></div>
            </div>
            <div class="tab-panel" id="panel-materials">
                <h3>🎨 Мои материалы</h3>
                <div id="materialsList"></div>
                <button id="showAddMaterial" class="primary" style="margin-top:20px;">➕ Добавить материал</button>
            </div>
            <div class="tab-panel" id="panel-settings">
                <h3>🔧 Глобальные параметры</h3>
                <div class="form-group"><label>Мощность (кВт)</label><input type="number" id="powerInput" value="0.15" step="0.01"></div>
                <div class="form-group"><label>Тариф (Br/кВт·ч)</label><input type="number" id="tariffInput" value="0.25" step="0.01"></div>
                <div class="form-group"><label>Амортизация (Br/ч)</label><input type="number" id="amortInput" value="10.0" step="0.1"></div>
                <button id="resetSettings" class="danger">🔄 Сбросить настройки</button>
            </div>
            <div class="tab-panel" id="panel-dictionaries">
                <h3>📋 Бренды и типы</h3>
                <div class="form-group"><label>Бренды</label><div id="brandsList"></div><input type="text" id="newBrandInput" placeholder="Новый бренд"><button id="addBrandBtn" class="small">Добавить</button></div>
                <div class="form-group"><label>Типы</label><div id="typesList"></div><input type="text" id="newTypeInput" placeholder="Новый тип"><button id="addTypeBtn" class="small">Добавить</button></div>
            </div>
        </div>
    </div>

    <!-- Модалка детали -->
    <div class="modal-overlay hidden" id="partModal">
        <div class="modal-content">
            <h3>Новая деталь</h3>
            <div class="form-group">
                <label>Материал</label>
                <select id="modalMaterialSelect"></select>
            </div>
            <div class="form-group">
                <label>Вес (г): <span id="modalWeightValue">100</span></label>
                <input type="range" id="modalWeightRange" min="1" max="2000" value="100" step="1">
                <input type="number" id="modalWeightInput" value="100" min="1" max="2000" style="margin-top:8px;">
            </div>
            <div class="form-group">
                <label>Время (ч): <span id="modalTimeValue">4.0</span></label>
                <input type="range" id="modalTimeRange" min="0.5" max="48" value="4" step="0.5">
                <input type="number" id="modalTimeInput" value="4" min="0.5" max="48" step="0.5" style="margin-top:8px;">
            </div>
            <div class="two-cols">
                <button id="modalCancelBtn" class="danger">Отмена</button>
                <button id="modalAddBtn" class="primary">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Модалка материала -->
    <div class="modal-overlay hidden" id="materialModal">
        <div class="modal-content">
            <h3>Новый материал</h3>
            <div class="form-group">
                <label>Бренд</label>
                <select id="matBrandSelect"><option value="">-- Выберите бренд --</option></select>
                <input type="text" id="matBrandOther" class="hidden" placeholder="Введите бренд">
            </div>
            <div class="form-group">
                <label>Тип филамента</label>
                <select id="matTypeSelect"><option value="">-- Выберите тип --</option></select>
                <input type="text" id="matTypeOther" class="hidden" placeholder="Введите тип">
            </div>
            <div class="form-group">
                <label>Серия</label>
                <input type="text" id="matSeries" placeholder="Pro, Silk, Easy...">
            </div>
            <div class="form-group">
                <label>Цвет</label>
                <div style="display:flex; gap:10px;">
                    <input type="color" id="matColorPicker" value="#ff0000" style="width:60px; padding:0;">
                    <input type="text" id="matColorText" placeholder="Название или HEX" style="flex:1;">
                </div>
            </div>
            <div class="two-cols">
                <div class="form-group"><label>Стоимость (Br)</label><input type="number" id="matPrice" value="30" step="0.01" placeholder="30"></div>
                <div class="form-group"><label>Масса катушки (г)</label><input type="number" id="matWeight" value="1000" step="1" placeholder="1000"></div>
            </div>
            <div class="two-cols">
                <button id="matCancelBtn" class="danger">Отмена</button>
                <button id="matSaveBtn" class="primary">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        document.addEventListener('touchmove', function(e) {
            if (!e.target.closest('.tab-content')) {
                e.preventDefault();
            }
        }, { passive: false });

        const DEFAULT_BRANDS = ["eSUN","BestFilament","Devil Design","Fiberlogy"];
        const DEFAULT_TYPES = ["PLA","ABS","PETG","TPU"];
        const DEFAULT_SETTINGS = {
            power: 0.15, tariff: 0.25, amortization: 10.0,
            materials: [
                {brand:"eSUN", type:"PLA+", series:"Pro", color:"#FF5733", pricePerPackage:30, packageWeight:1000},
                {brand:"BestFilament", type:"ABS", series:"", color:"#33FF57", pricePerPackage:45, packageWeight:1000}
            ]
        };

        function getDict(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } }
        function saveDict(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
        function getUsage(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } }
        function incUsage(k, v) { let u = getUsage(k); u[v] = (u[v]||0)+1; localStorage.setItem(k, JSON.stringify(u)); }

        let customBrands = getDict('brands', DEFAULT_BRANDS);
        let customTypes = getDict('types', DEFAULT_TYPES);
        let brandUsage = getUsage('brandUsage');
        let typeUsage = getUsage('typeUsage');
        function saveBrands() { saveDict('brands', customBrands); }
        function saveTypes() { saveDict('types', customTypes); }

        function populateSelect(select, items, usage, otherOption = true) {
            select.innerHTML = '<option value="">-- выбрать --</option>';
            if (!items || !Array.isArray(items)) return;
            [...items].sort((a,b) => (usage[b]||0)-(usage[a]||0) || a.localeCompare(b)).forEach(item => {
                let opt = document.createElement('option'); opt.value = item; opt.textContent = item; select.appendChild(opt);
            });
            if (otherOption) { let o = document.createElement('option'); o.value = 'other'; o.textContent = 'Другое...'; select.appendChild(o); }
        }

        function populateAllSelects() {
            populateSelect(document.getElementById('matBrandSelect'), customBrands, brandUsage);
            populateSelect(document.getElementById('matTypeSelect'), customTypes, typeUsage);
        }

        function updatePartMaterialSelect() {
            let sel = document.getElementById('modalMaterialSelect');
            if (!sel) return;
            sel.innerHTML = '';
            settings.materials.forEach((m,i) => {
                let o = document.createElement('option'); o.value = i;
                let ppg = (m.pricePerPackage / m.packageWeight).toFixed(2);
                o.textContent = `${m.brand} ${m.type} (${ppg} Br/г)`;
                sel.appendChild(o);
            });
        }

        function loadSettings() { return getDict('settings', DEFAULT_SETTINGS); }
        function saveSettings(s) { saveDict('settings', s); }
        let settings = loadSettings();
        function saveAll() { saveSettings(settings); }

        let parts = [];
        function renderParts() {
            let c = document.getElementById('partsContainer'); c.innerHTML = '';
            parts.forEach((p,i) => {
                let d = document.createElement('div'); d.className = 'part-item';
                d.dataset.index = i;
                d.innerHTML = `
                    <div style="flex:1; font-weight:600;">${p.mat.brand} ${p.mat.type} ${p.mat.series||''}</div>
                    <label>Вес(г)</label><input type="number" class="part-weight" value="${p.weight}" min="0">
                    <label>Время(ч)</label><input type="number" class="part-time" value="${p.time}" min="0" step="0.1">
                    <button class="small danger remove-part">✕</button>`;
                c.appendChild(d);
            });
            c.oninput = function(e) {
                if (e.target.classList.contains('part-weight') || e.target.classList.contains('part-time')) {
                    const itemDiv = e.target.closest('.part-item');
                    const idx = itemDiv.dataset.index;
                    parts[idx].weight = parseFloat(itemDiv.querySelector('.part-weight').value) || 0;
                    parts[idx].time = parseFloat(itemDiv.querySelector('.part-time').value) || 0;
                    recalc();
                }
            };
            c.onclick = function(e) {
                if (e.target.classList.contains('remove-part')) {
                    const idx = e.target.closest('.part-item').dataset.index;
                    parts.splice(idx, 1);
                    renderParts();
                    recalc();
                }
            };
        }

        function recalc() {
            if (!parts.length) { document.getElementById('result').innerHTML = '<p>Добавьте детали.</p>'; return; }
            let margin = parseFloat(document.getElementById('marginSelect').value);
            let totalCost = 0;
            let details = '';
            parts.forEach(p => {
                let ppg = p.mat.pricePerPackage / p.mat.packageWeight;
                let plasticCost = p.weight * ppg;
                let electricityCost = settings.power * p.time * settings.tariff;
                let amortization = settings.amortization * p.time;
                let partTotal = plasticCost + electricityCost + amortization;
                totalCost += partTotal;
                details += `
                <div class="part-card">
                    <h4>🧱 ${p.mat.brand} ${p.mat.type} ${p.mat.series||''}</h4>
                    <div class="detail-row"><span>⚖️ Вес</span><span>${p.weight} г</span></div>
                    <div class="detail-row"><span>⏱️ Время</span><span>${p.time.toFixed(1)} ч</span></div>
                    <div class="detail-row"><span>💵 Пластик (${ppg.toFixed(3)} Br/г)</span><span>${plasticCost.toFixed(2)} Br</span></div>
                    <div class="detail-row"><span>⚡ Электричество</span><span>${electricityCost.toFixed(2)} Br</span></div>
                    <div class="detail-row"><span>🔧 Амортизация</span><span>${amortization.toFixed(2)} Br</span></div>
                    <div class="detail-row" style="font-weight:600; margin-top:8px;"><span>📦 Сумма по детали</span><span>${partTotal.toFixed(2)} Br</span></div>
                </div>`;
            });
            let final = totalCost * margin;
            document.getElementById('result').innerHTML = `
                <div style="margin-bottom:16px; font-weight:600;">📊 Сводка заказа</div>
                ${details}
                <div class="summary-block">
                    <div class="detail-row"><span>🔹 Себестоимость всех деталей</span><span><strong>${totalCost.toFixed(2)} Br</strong></span></div>
                    <hr>
                    <div class="detail-row" style="font-size:1.2em; font-weight:700;"><span>💰 Итого к оплате (×${margin})</span><span style="color:${margin<=1?'#34c759':margin<=1.2?'#ffcc00':margin<=1.5?'#ff9500':'#ff3b30'}">${final.toFixed(2)} Br</span></div>
                </div>
            `;
            document.getElementById('result').dataset.final = final.toFixed(2);
        }

        // Модалка детали
        const partModal = document.getElementById('partModal');
        const modalMaterial = document.getElementById('modalMaterialSelect');
        const modalWeightRange = document.getElementById('modalWeightRange');
        const modalWeightInput = document.getElementById('modalWeightInput');
        const modalWeightValue = document.getElementById('modalWeightValue');
        const modalTimeRange = document.getElementById('modalTimeRange');
        const modalTimeInput = document.getElementById('modalTimeInput');
        const modalTimeValue = document.getElementById('modalTimeValue');

        function syncRangeInput(range, input, valueSpan) {
            range.addEventListener('input', () => { input.value = range.value; valueSpan.textContent = range.value; });
            input.addEventListener('input', () => { range.value = input.value; valueSpan.textContent = input.value; });
        }
        syncRangeInput(modalWeightRange, modalWeightInput, modalWeightValue);
        syncRangeInput(modalTimeRange, modalTimeInput, modalTimeValue);

        document.getElementById('addPartBtn').addEventListener('click', () => {
            updatePartMaterialSelect();
            partModal.classList.remove('hidden');
        });
        document.getElementById('modalCancelBtn').addEventListener('click', () => partModal.classList.add('hidden'));
        document.getElementById('modalAddBtn').addEventListener('click', () => {
            let idx = modalMaterial.value;
            if (idx === '') { alert('Выберите материал'); return; }
            let mat = settings.materials[idx];
            parts.push({ mat, weight: parseFloat(modalWeightInput.value) || 100, time: parseFloat(modalTimeInput.value) || 4 });
            partModal.classList.add('hidden');
            renderParts();
            recalc();
        });

        // Модалка материала
        const matModal = document.getElementById('materialModal');
        document.getElementById('showAddMaterial').addEventListener('click', () => {
            populateAllSelects();
            matModal.classList.remove('hidden');
        });
        document.getElementById('matCancelBtn').addEventListener('click', () => matModal.classList.add('hidden'));
        document.getElementById('matSaveBtn').addEventListener('click', () => {
            let brand = document.getElementById('matBrandSelect').value;
            if (brand === 'other') brand = document.getElementById('matBrandOther').value.trim();
            let type = document.getElementById('matTypeSelect').value;
            if (type === 'other') type = document.getElementById('matTypeOther').value.trim();
            if (!brand || !type) return alert('Заполните бренд и тип');
            let material = {
                brand, type,
                series: document.getElementById('matSeries').value.trim(),
                color: document.getElementById('matColorText').value.trim() || document.getElementById('matColorPicker').value,
                pricePerPackage: parseFloat(document.getElementById('matPrice').value) || 30,
                packageWeight: parseFloat(document.getElementById('matWeight').value) || 1000
            };
            settings.materials.push(material);
            incUsage('brandUsage', brand); brandUsage = getUsage('brandUsage');
            incUsage('typeUsage', type); typeUsage = getUsage('typeUsage');
            if (!customBrands.includes(brand)) { customBrands.push(brand); saveBrands(); }
            if (!customTypes.includes(type)) { customTypes.push(type); saveTypes(); }
            saveAll();
            matModal.classList.add('hidden');
            updatePartMaterialSelect();
            renderMaterialsList();
        });

        document.getElementById('matBrandSelect').addEventListener('change', function() {
            document.getElementById('matBrandOther').classList.toggle('hidden', this.value !== 'other');
        });
        document.getElementById('matTypeSelect').addEventListener('change', function() {
            document.getElementById('matTypeOther').classList.toggle('hidden', this.value !== 'other');
        });

        document.getElementById('saveOrderBtn').addEventListener('click', () => {
            let name = document.getElementById('orderName').value.trim() || 'Без названия';
            let margin = document.getElementById('marginSelect').value;
            let order = { name, margin, parts: parts.map(p => ({ matIndex: settings.materials.indexOf(p.mat), weight: p.weight, time: p.time })), date: new Date().toISOString() };
            let archive = getDict('orders', []);
            archive.push(order);
            saveDict('orders', archive);
            alert('Заказ сохранён');
        });
        document.getElementById('loadOrderBtn').addEventListener('click', () => {
            let archive = getDict('orders', []);
            let div = document.getElementById('archiveList');
            div.classList.toggle('hidden');
            if (div.classList.contains('hidden')) return;
            div.innerHTML = archive.length ? '' : '<p>Нет заказов</p>';
            archive.forEach((o, i) => {
                let d = document.createElement('div'); d.className = 'dict-item';
                d.innerHTML = `<span>${o.name} (${new Date(o.date).toLocaleDateString()})</span>
                               <button class="small load-order" data-idx="${i}">Загрузить</button>
                               <button class="small danger del-order" data-idx="${i}">🗑️</button>`;
                div.appendChild(d);
            });
            document.querySelectorAll('.load-order').forEach(b => b.addEventListener('click', e => {
                let order = archive[e.target.dataset.idx];
                document.getElementById('orderName').value = order.name;
                document.getElementById('marginSelect').value = order.margin;
                parts = order.parts.map(p => ({ mat: settings.materials[p.matIndex], weight: p.weight, time: p.time }));
                renderParts(); recalc(); div.classList.add('hidden');
            }));
            document.querySelectorAll('.del-order').forEach(b => b.addEventListener('click', e => {
                archive.splice(e.target.dataset.idx, 1); saveDict('orders', archive); document.getElementById('loadOrderBtn').click();
            }));
        });
        document.getElementById('shareBtn').addEventListener('click', () => {
            let text = `Заказ: ${document.getElementById('orderName').value}\n` +
                       parts.map(p => `▪ ${p.mat.brand} ${p.mat.type} — ${p.weight}г / ${p.time}ч`).join('\n') +
                       `\n💰 Итого: ${document.getElementById('result').dataset.final} Br`;
            if (navigator.share) navigator.share({ title: 'Расчёт 3D-печати', text });
            else { navigator.clipboard.writeText(text); alert('Скопировано'); }
        });

        function renderMaterialsList() {
            let list = document.getElementById('materialsList'); list.innerHTML = '';
            settings.materials.sort((a,b) => (a.type || '').localeCompare(b.type || '')).forEach((m,i) => {
                let d = document.createElement('div'); d.className = 'material-item';
                d.innerHTML = `<span>${m.brand} ${m.type} ${m.series} (${m.pricePerPackage} Br/${m.packageWeight}г)</span>
                               <button class="small del-mat" data-idx="${i}">🗑️</button>`;
                list.appendChild(d);
            });
            document.querySelectorAll('.del-mat').forEach(b => b.addEventListener('click', e => {
                settings.materials.splice(e.target.dataset.idx, 1); saveAll(); updatePartMaterialSelect(); renderMaterialsList();
            }));
        }

        document.getElementById('addBrandBtn').addEventListener('click', () => {
            let v = document.getElementById('newBrandInput').value.trim();
            if (v && !customBrands.includes(v)) { customBrands.push(v); saveBrands(); populateAllSelects(); renderBrandsList(); }
        });
        document.getElementById('addTypeBtn').addEventListener('click', () => {
            let v = document.getElementById('newTypeInput').value.trim();
            if (v && !customTypes.includes(v)) { customTypes.push(v); saveTypes(); populateAllSelects(); renderTypesList(); }
        });
        function renderBrandsList() {
            let c = document.getElementById('brandsList'); c.innerHTML = '';
            customBrands.forEach(b => {
                let d = document.createElement('div'); d.className = 'dict-item';
                d.innerHTML = `<span>${b}</span><button class="small danger">🗑️</button>`;
                d.querySelector('button').addEventListener('click', () => {
                    customBrands = customBrands.filter(x => x !== b); saveBrands(); populateAllSelects(); renderBrandsList();
                });
                c.appendChild(d);
            });
        }
        function renderTypesList() {
            let c = document.getElementById('typesList'); c.innerHTML = '';
            customTypes.forEach(t => {
                let d = document.createElement('div'); d.className = 'dict-item';
                d.innerHTML = `<span>${t}</span><button class="small danger">🗑️</button>`;
                d.querySelector('button').addEventListener('click', () => {
                    customTypes = customTypes.filter(x => x !== t); saveTypes(); populateAllSelects(); renderTypesList();
                });
                c.appendChild(d);
            });
        }

        document.getElementById('powerInput').addEventListener('change', function() { settings.power = +this.value; saveAll(); recalc(); });
        document.getElementById('tariffInput').addEventListener('change', function() { settings.tariff = +this.value; saveAll(); recalc(); });
        document.getElementById('amortInput').addEventListener('change', function() { settings.amortization = +this.value; saveAll(); recalc(); });
        document.getElementById('resetSettings').addEventListener('click', () => {
            if (!confirm('Сбросить все настройки и материалы?')) return;
            ['settings','brands','types','brandUsage','typeUsage','orders'].forEach(k => localStorage.removeItem(k));
            location.reload();
        });

        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            document.getElementById('panel-' + t.dataset.tab).classList.add('active');
            if (t.dataset.tab === 'settings') {
                document.getElementById('powerInput').value = settings.power;
                document.getElementById('tariffInput').value = settings.tariff;
                document.getElementById('amortInput').value = settings.amortization;
            }
        }));

        populateAllSelects();
        updatePartMaterialSelect();
        renderMaterialsList();
        renderBrandsList();
        renderTypesList();
        renderParts();
        recalc();
    </script>
</body>
</html>
