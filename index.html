<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Калькулятор 3D-печати</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: rgba(255,255,255,0.15);
            --text: #1c1c1e;
            --button: #007aff;
            --button-text: #ffffff;
            --glass: rgba(255,255,255,0.45);
            --glass-strong: rgba(255,255,255,0.65);
            --border: rgba(255,255,255,0.4);
            --shadow: 0 8px 32px rgba(0,0,0,0.08);
            --radius: 24px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: rgba(28,28,30,0.3);
                --text: #f5f5f7;
                --glass: rgba(255,255,255,0.08);
                --glass-strong: rgba(255,255,255,0.14);
                --border: rgba(255,255,255,0.15);
                --shadow: 0 8px 32px rgba(0,0,0,0.4);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            color: var(--text);
            display: flex; flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: env(safe-area-inset-top) 12px 12px 12px;
        }
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            z-index: -1;
        }
        .container {
            width: 100%; max-width: 500px;
            background: var(--glass);
            border-radius: 32px;
            padding: 24px 18px;
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        h2 { text-align: center; margin-bottom: 20px; font-size: 1.5em; font-weight: 700; }
        .tabs {
            display: flex; gap: 4px; margin-bottom: 24px;
            border-bottom: 2px solid var(--border); flex-wrap: wrap;
        }
        .tab {
            flex: 1 0 auto; text-align: center; padding: 10px 6px; cursor: pointer;
            font-weight: 600; border-bottom: 3px solid transparent;
            transition: 0.2s; font-size: 13px; white-space: nowrap;
            background: transparent; color: var(--text);
            border-radius: 12px 12px 0 0;
        }
        .tab.active {
            background: var(--glass-strong);
            border-bottom-color: var(--button);
            color: var(--button);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95em; }
        select, input[type="range"], input[type="number"], input[type="text"], input[type="color"] {
            width: 100%; padding: 12px 14px; border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--glass-strong);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text); font-size: 15px;
            transition: all 0.2s; outline: none;
        }
        select:focus, input:focus { border-color: var(--button); box-shadow: 0 0 0 3px rgba(0,122,255,0.2); }
        input[type="range"] {
            padding: 0; height: 8px; background: var(--glass); border-radius: 4px;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: var(--button); border-radius: 50%; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .range-labels { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.7; margin-top: 4px; }
        button {
            background: var(--glass-strong);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.2s;
        }
        button.primary { background: var(--button); color: var(--button-text); border: none; }
        button.danger { background: rgba(255,59,48,0.2); border-color: rgba(255,59,48,0.4); color: #ff3b30; }
        button.small { width: auto; padding: 8px 16px; margin: 4px; font-size: 14px; border-radius: 14px; }
        .material-item, .dict-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass); padding: 12px; border-radius: 16px;
            margin-bottom: 10px; flex-wrap: wrap;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
        }
        .material-color {
            display: inline-block; width: 20px; height: 20px;
            border-radius: 50%; margin-right: 10px; vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.2);
        }
        .add-material-form, .dict-form {
            background: var(--glass); border-radius: 24px; padding: 20px; margin-top: 20px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }
        .add-material-form input, .add-material-form select { margin-bottom: 12px; }
        .two-cols { display: flex; gap: 12px; }
        .two-cols > * { flex: 1; }
        .hidden { display: none; }
        .custom-select { position: relative; width: 100%; }
        .custom-select-trigger {
            padding: 12px 14px; border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--glass-strong);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            color: var(--text); font-size: 15px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
        }
        .custom-options {
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--glass-strong); border: 1px solid var(--border);
            border-radius: 0 0 20px 20px; max-height: 240px; overflow-y: auto;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 10; display: none;
        }
        .custom-options.open { display: block; }
        .custom-option {
            padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--border); transition: background 0.2s;
        }
        .custom-option:hover { background: var(--button); color: #fff; }
        .color-dot {
            display: inline-block; width: 20px; height: 20px;
            border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0;
        }
        .result {
            background: var(--glass-strong); border-radius: 24px; padding: 20px;
            margin: 24px 0; line-height: 1.5;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border); box-shadow: var(--shadow);
        }
        .price { font-size: 28px; font-weight: 700; margin: 10px 0; transition: color 0.3s; }
        #ralSearchBlock {
            background: var(--glass); border-radius: 16px; padding: 14px; margin-top: 10px;
        }
        #ralCodeInput { width: 100%; margin-bottom: 8px; }
        .parts-list { margin-bottom: 20px; }
        .part-item {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            background: var(--glass); padding: 10px; border-radius: 16px;
            margin-bottom: 10px; border: 1px solid var(--border);
        }
        .part-item span { flex: 1; }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <h2>🧮 Расчёт 3D-печати</h2>

        <div class="tabs">
            <div class="tab active" data-tab="calc">📊 Расчёт</div>
            <div class="tab" data-tab="materials">🎨 Материалы</div>
            <div class="tab" data-tab="settings">⚙️ Настройки</div>
            <div class="tab" data-tab="dictionaries">📋 Справочники</div>
        </div>

        <div class="tab-panel active" id="panel-calc">
            <div class="form-group">
                <label>Название заказа</label>
                <input type="text" id="orderName" placeholder="например, Кронштейн v2">
            </div>
            <div class="parts-list" id="partsContainer"></div>
            <button id="addPartBtn" class="small">➕ Добавить деталь</button>
            <div class="form-group" style="margin-top:20px;">
                <label>Наценка на заказ:</label>
                <select id="marginSelect">
                    <option value="1.0">×1.0 (без наценки)</option>
                    <option value="1.2" selected>×1.2 (+20%)</option>
                    <option value="1.5">×1.5 (+50%)</option>
                    <option value="2.0">×2.0 (+100%)</option>
                </select>
            </div>
            <div class="result" id="result"></div>
            <button id="sendBtn" class="primary">📤 Отправить расчёт в чат</button>
            <button id="shareBtn">📋 Поделиться</button>
            <button id="saveOrderBtn">💾 Сохранить заказ</button>
            <button id="loadOrderBtn">📂 Загрузить из архива</button>
            <div id="archiveList" class="hidden" style="margin-top:16px;"></div>
        </div>

        <div class="tab-panel" id="panel-materials">
            <h3>🎨 Список материалов</h3>
            <div class="sort-btns">
                <button id="sortByType" class="small">По типу</button>
            </div>
            <div id="materialsList"></div>
            <button id="showAddMaterial" class="primary">➕ Добавить материал</button>
            <div class="add-material-form" id="addMaterialForm" style="display:none;">
                <div class="form-group">
                    <label>Бренд</label>
                    <select id="brandSelect"></select>
                    <input type="text" id="newBrandOther" class="hidden" placeholder="Введите бренд">
                </div>
                <div class="form-group">
                    <label>Тип</label>
                    <select id="typeSelect"></select>
                    <input type="text" id="newTypeOther" class="hidden" placeholder="Введите тип">
                </div>
                <div class="form-group">
                    <label>Серия (опционально)</label>
                    <input type="text" id="newSeries" placeholder="Pro, Silk, Easy...">
                </div>
                <div class="form-group">
                    <label>Цвет</label>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <input type="color" id="newColorPicker" value="#ff0000" style="width:60px; padding:0;">
                        <input type="text" id="newColorText" placeholder="Название или HEX" style="flex:1;">
                        <button type="button" class="small" id="ralBtn">🎨 RAL</button>
                    </div>
                    <div id="ralSearchBlock" class="hidden">
                        <label>Введите код RAL (например, 4005)</label>
                        <input type="text" id="ralCodeInput" placeholder="4005">
                        <button class="small" id="ralSearchBtn">Найти</button>
                        <div id="ralResult" style="margin-top:6px;"></div>
                    </div>
                </div>
                <div class="two-cols">
                    <div class="form-group">
                        <label>Цена за упак. (Br)</label>
                        <input type="number" id="newPrice" step="0.01" min="0" value="30">
                    </div>
                    <div class="form-group">
                        <label>Вес упак. (г)</label>
                        <input type="number" id="newWeight" step="1" min="1" value="1000">
                    </div>
                </div>
                <button id="saveNewMaterial" class="primary">💾 Сохранить</button>
                <button id="cancelAddMaterial" class="danger">Отмена</button>
            </div>
        </div>

        <div class="tab-panel" id="panel-settings">
            <h3>🔧 Глобальные параметры</h3>
            <div class="form-group">
                <label>Мощность принтера (кВт)</label>
                <input type="number" id="powerInput" step="0.01" min="0" value="0.15">
            </div>
            <div class="form-group">
                <label>Тариф за электричество (Br/кВт·ч)</label>
                <input type="number" id="tariffInput" step="0.01" min="0" value="0.25">
            </div>
            <div class="form-group">
                <label>Амортизация (Br/час)</label>
                <input type="number" id="amortInput" step="0.1" min="0" value="10.0">
            </div>
            <p style="font-size:0.9em; opacity:0.8; margin: 20px 0;">Все суммы в белорусских рублях (Br).</p>
            <button id="resetSettings" class="danger">🔄 Сбросить настройки</button>
        </div>

        <div class="tab-panel" id="panel-dictionaries">
            <h3>📋 Редактирование справочников</h3>
            <div class="form-group">
                <label>Бренды</label>
                <div id="brandsList"></div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <input type="text" id="newBrandInput" placeholder="Новый бренд">
                    <button id="addBrandBtn" class="small">Добавить</button>
                </div>
            </div>
            <div class="form-group">
                <label>Типы пластика</label>
                <div id="typesList"></div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <input type="text" id="newTypeInput" placeholder="Новый тип">
                    <button id="addTypeBtn" class="small">Добавить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const ralColorsFull = [
            {code:"RAL 1000", name:"Зелёно-бежевый", hex:"#BEBD7F"},
            {code:"RAL 1001", name:"Бежевый", hex:"#C2B078"},
            {code:"RAL 4005", name:"Сине-сиреневый", hex:"#7A6A9A"},
            {code:"RAL 4006", name:"Транспортный пурпурный", hex:"#993366"},
            {code:"RAL 9005", name:"Глубокий чёрный", hex:"#0A0A0A"},
            {code:"RAL 9010", name:"Чистый белый", hex:"#F1ECE1"}
        ];

        const colorNamesMap = {
            "красный": "#ff0000", "алый": "#ff2400", "бордовый": "#800000",
            "синий": "#0000ff", "зелёный": "#008000", "белый": "#ffffff",
            "чёрный": "#000000"
        };
        const colorList = Object.entries(colorNamesMap).map(([name, hex]) => {
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            return {name, hex, r, g, b};
        });
        function findClosestColorName(hex) {
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            let minDist = Infinity, closest = '';
            for (let c of colorList) {
                const dr = r - c.r, dg = g - c.g, db = b - c.b;
                const dist = dr*dr + dg*dg + db*db;
                if (dist < minDist) { minDist = dist; closest = c.name; }
            }
            return closest;
        }
        function getColorName(mat) {
            if (!mat || !mat.color) return 'нет';
            if (mat.color.startsWith('#')) return findClosestColorName(mat.color);
            return mat.color;
        }

        const DEFAULT_BRANDS = ["eSUN","BestFilament","Devil Design","Fiberlogy","Gembird","Creality","Hatchbox","Polymaker","Prusament"];
        const DEFAULT_TYPES = ["PLA","PLA+","ABS","PETG","TPU","ASA","Nylon","PC","HIPS","PVA","Wood","Metal"];
        const DEFAULT_SETTINGS = {
            power: 0.15, tariff: 0.25, amortization: 10.0,
            materials: [
                {brand:"eSUN", type:"PLA+", series:"Pro", color:"#FF5733", pricePerPackage:30, packageWeight:1000},
                {brand:"BestFilament", type:"ABS", series:"", color:"#33FF57", pricePerPackage:45, packageWeight:1000},
                {brand:"Fiberlogy", type:"PETG", series:"Easy", color:"#3357FF", pricePerPackage:55, packageWeight:1000}
            ]
        };

        function getDict(key, defaults) {
            const saved = localStorage.getItem(key);
            if (saved) { try { return JSON.parse(saved); } catch(e) {} }
            return [...defaults];
        }
        function saveDict(key, arr) { localStorage.setItem(key, JSON.stringify(arr)); }
        function getUsage(key) {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : {};
        }
        function incrementUsage(key, value) {
            const usage = getUsage(key);
            usage[value] = (usage[value] || 0) + 1;
            localStorage.setItem(key, JSON.stringify(usage));
        }

        let customBrands = getDict('customBrands', DEFAULT_BRANDS);
        let customTypes = getDict('customTypes', DEFAULT_TYPES);
        let brandUsage = getUsage('brandUsage');
        let typeUsage = getUsage('typeUsage');
        function saveBrands() { saveDict('customBrands', customBrands); }
        function saveTypes() { saveDict('customTypes', customTypes); }

        function populateBrandSelect() {
            brandSelect.innerHTML = '<option value="">-- Выберите бренд --</option>';
            const sorted = [...customBrands].sort((a,b) => {
                const countA = brandUsage[a] || 0;
                const countB = brandUsage[b] || 0;
                if (countA !== countB) return countB - countA;
                return a.localeCompare(b);
            });
            sorted.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b; opt.textContent = b;
                brandSelect.appendChild(opt);
            });
            const otherOpt = document.createElement('option');
            otherOpt.value = 'other'; otherOpt.textContent = 'Другое...';
            brandSelect.appendChild(otherOpt);
        }

        function populateTypeSelect() {
            typeSelect.innerHTML = '<option value="">-- Выберите тип --</option>';
            const sorted = [...customTypes].sort((a,b) => {
                const countA = typeUsage[a] || 0;
                const countB = typeUsage[b] || 0;
                if (countA !== countB) return countB - countA;
                return a.localeCompare(b);
            });
            sorted.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.textContent = t;
                typeSelect.appendChild(opt);
            });
            const otherOpt = document.createElement('option');
            otherOpt.value = 'other'; otherOpt.textContent = 'Другое...';
            typeSelect.appendChild(otherOpt);
        }

        let selectedMaterialIndex = null;
        const materialTrigger = document.getElementById('materialTrigger');
        const materialTriggerText = document.getElementById('materialTriggerText');
        const materialOptions = document.getElementById('materialOptions');
        const materialCustomSelect = document.getElementById('materialCustomSelect');

        function updateCustomMaterialSelect() {
            materialOptions.innerHTML = '';
            if (settings.materials.length === 0) {
                const opt = document.createElement('div'); opt.className = 'custom-option';
                opt.textContent = 'Нет материалов';
                materialOptions.appendChild(opt);
                materialTriggerText.textContent = 'Выберите материал';
                materialTrigger.querySelector('.color-dot').style.background = '#ccc';
                selectedMaterialIndex = null;
                return;
            }
            settings.materials.forEach((mat, index) => {
                const opt = document.createElement('div'); opt.className = 'custom-option';
                opt.dataset.index = index;
                const ppg = (mat.pricePerPackage / mat.packageWeight).toFixed(3);
                const colorName = getColorName(mat);
                opt.innerHTML = `<span class="color-dot" style="background:${mat.color || '#ccc'}"></span> ${mat.brand} ${mat.type}${mat.series?' '+mat.series:''} — ${ppg} Br/г (${colorName})`;
                opt.addEventListener('click', () => {
                    selectMaterial(index);
                    materialOptions.classList.remove('open');
                });
                materialOptions.appendChild(opt);
            });
            if (selectedMaterialIndex !== null && settings.materials[selectedMaterialIndex]) {
                selectMaterial(selectedMaterialIndex);
            } else if (settings.materials.length > 0) {
                selectMaterial(0);
            }
        }

        function selectMaterial(index) {
            const mat = settings.materials[index];
            if (!mat) return;
            selectedMaterialIndex = index;
            const ppg = (mat.pricePerPackage / mat.packageWeight).toFixed(3);
            const colorName = getColorName(mat);
            materialTriggerText.textContent = `${mat.brand} ${mat.type}${mat.series?' '+mat.series:''} — ${ppg} Br/г (${colorName})`;
            materialTrigger.querySelector('.color-dot').style.background = mat.color || '#ccc';
        }

        materialTrigger.addEventListener('click', () => materialOptions.classList.toggle('open'));
        document.addEventListener('click', (e) => {
            if (!materialCustomSelect.contains(e.target)) materialOptions.classList.remove('open');
        });

        function renderBrandsList() {
            const container = document.getElementById('brandsList');
            container.innerHTML = '';
            customBrands.forEach(b => {
                const div = document.createElement('div'); div.className = 'dict-item';
                div.innerHTML = `<span>${b}</span>`;
                const delBtn = document.createElement('button');
                delBtn.className = 'small danger'; delBtn.textContent = '🗑️';
                delBtn.addEventListener('click', () => {
                    customBrands = customBrands.filter(x => x !== b);
                    saveBrands(); renderBrandsList(); populateBrandSelect();
                });
                div.appendChild(delBtn); container.appendChild(div);
            });
        }

        function renderTypesList() {
            const container = document.getElementById('typesList');
            container.innerHTML = '';
            customTypes.forEach(t => {
                const div = document.createElement('div'); div.className = 'dict-item';
                div.innerHTML = `<span>${t}</span>`;
                const delBtn = document.createElement('button');
                delBtn.className = 'small danger'; delBtn.textContent = '🗑️';
                delBtn.addEventListener('click', () => {
                    customTypes = customTypes.filter(x => x !== t);
                    saveTypes(); renderTypesList(); populateTypeSelect();
                });
                div.appendChild(delBtn); container.appendChild(div);
            });
        }

        function loadSettings() {
            const saved = localStorage.getItem('printCalcSettings');
            if (saved) { try { return JSON.parse(saved); } catch(e) {} }
            return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        }
        function saveSettings(s) { localStorage.setItem('printCalcSettings', JSON.stringify(s)); }
        let settings = loadSettings();

        let sortByTypeAsc = true;
        function sortByType() {
            sortByTypeAsc = !sortByTypeAsc;
            settings.materials.sort((a,b) => {
                const nameA = a.type.toLowerCase();
                const nameB = b.type.toLowerCase();
                if (nameA < nameB) return sortByTypeAsc ? -1 : 1;
                if (nameA > nameB) return sortByTypeAsc ? 1 : -1;
                return 0;
            });
            saveSettings(settings);
            renderMaterialsList();
            updateCustomMaterialSelect();
        }

        let parts = [];
        function renderParts() {
            const container = document.getElementById('partsContainer');
            container.innerHTML = '';
            parts.forEach((part, idx) => {
                const div = document.createElement('div'); div.className = 'part-item';
                div.innerHTML = `
                    <span>${part.materialName} — ${part.weight}г / ${part.time}ч</span>
                    <button class="small danger" data-idx="${idx}">✕</button>
                `;
                container.appendChild(div);
            });
            document.querySelectorAll('.part-item .danger').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.dataset.idx;
                    parts.splice(idx, 1);
                    renderParts();
                    recalculate();
                });
            });
        }

        function recalculate() {
            if (parts.length === 0) {
                document.getElementById('result').innerHTML = '<p>Добавьте хотя бы одну деталь.</p>';
                return;
            }
            const margin = parseFloat(document.getElementById('marginSelect').value);
            let totalCost = 0;
            parts.forEach(part => {
                const mat = part.mat;
                const ppg = mat.pricePerPackage / mat.packageWeight;
                const plasticCost = part.weight * ppg;
                const electricityCost = settings.power * part.time * settings.tariff;
                const amortization = settings.amortization * part.time;
                totalCost += plasticCost + electricityCost + amortization;
            });
            const finalPrice = totalCost * margin;
            const resultDiv = document.getElementById('result');
            let priceColor;
            if (margin <= 1.0) priceColor = '#34c759';
            else if (margin <= 1.2) priceColor = '#ffcc00';
            else if (margin <= 1.5) priceColor = '#ff9500';
            else priceColor = '#ff3b30';
            resultDiv.innerHTML = `
                <strong>📊 Сводка заказа</strong><br>
                <ul style="list-style:none;padding:0;">
                    ${parts.map(p => {
                        const ppg = (p.mat.pricePerPackage / p.mat.packageWeight).toFixed(3);
                        const pc = (p.weight * ppg).toFixed(2);
                        return `<li>▪ ${p.mat.brand} ${p.mat.type} — ${p.weight}г × ${ppg} Br/г = ${pc} Br</li>`;
                    }).join('')}
                </ul>
                ▪ Себестоимость всего: ${totalCost.toFixed(2)} Br<br>
                <div class="price" style="color:${priceColor}">💰 Итого к оплате: ${finalPrice.toFixed(2)} Br</div>`;
            resultDiv.dataset.finalPrice = finalPrice.toFixed(2);
            resultDiv.dataset.totalCost = totalCost.toFixed(2);
        }

        function addPart() {
            if (settings.materials.length === 0) { alert('Добавьте материалы.'); return; }
            if (selectedMaterialIndex === null) selectMaterial(0);
            const mat = settings.materials[selectedMaterialIndex];
            parts.push({
                mat: mat,
                weight: 100,
                time: 1,
                materialName: `${mat.brand} ${mat.type}`
            });
            renderParts();
            recalculate();
        }

        function saveOrder() {
            const orderName = document.getElementById('orderName').value.trim() || 'Без названия';
            const margin = document.getElementById('marginSelect').value;
            const order = {
                name: orderName,
                margin: margin,
                parts: parts.map(p => ({
                    matIndex: settings.materials.indexOf(p.mat),
                    weight: p.weight,
                    time: p.time
                })),
                date: new Date().toISOString()
            };
            let archive = JSON.parse(localStorage.getItem('ordersArchive') || '[]');
            archive.push(order);
            localStorage.setItem('ordersArchive', JSON.stringify(archive));
            alert('Заказ сохранён.');
        }

        function loadArchive() {
            const archiveDiv = document.getElementById('archiveList');
            archiveDiv.classList.toggle('hidden');
            if (archiveDiv.classList.contains('hidden')) return;
            const archive = JSON.parse(localStorage.getItem('ordersArchive') || '[]');
            archiveDiv.innerHTML = '';
            if (archive.length === 0) archiveDiv.innerHTML = '<p>Нет сохранённых заказов.</p>';
            archive.forEach((order, idx) => {
                const div = document.createElement('div'); div.className = 'dict-item';
                div.innerHTML = `
                    <span>📦 ${order.name} (${new Date(order.date).toLocaleDateString()})</span>
                    <button class="small" data-idx="${idx}">Загрузить</button>
                    <button class="small danger" data-idx="${idx}">🗑️</button>
                `;
                archiveDiv.appendChild(div);
            });
            document.querySelectorAll('#archiveList .small:not(.danger)').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.dataset.idx;
                    const order = JSON.parse(localStorage.getItem('ordersArchive') || '[]')[idx];
                    document.getElementById('orderName').value = order.name;
                    document.getElementById('marginSelect').value = order.margin;
                    parts = order.parts.map(p => ({
                        mat: settings.materials[p.matIndex],
                        weight: p.weight,
                        time: p.time,
                        materialName: `${settings.materials[p.matIndex].brand} ${settings.materials[p.matIndex].type}`
                    }));
                    renderParts();
                    recalculate();
                    document.getElementById('archiveList').classList.add('hidden');
                });
            });
            document.querySelectorAll('#archiveList .danger').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.dataset.idx;
                    let archive = JSON.parse(localStorage.getItem('ordersArchive') || '[]');
                    archive.splice(idx,1);
                    localStorage.setItem('ordersArchive', JSON.stringify(archive));
                    loadArchive();
                });
            });
        }

        const weightInput = document.getElementById('weight');
        const weightValue = document.getElementById('weightValue');
        const timeInput = document.getElementById('time');
        const timeValue = document.getElementById('timeValue');
        const marginSelect = document.getElementById('marginSelect');
        const materialsListDiv = document.getElementById('materialsList');
        const addMaterialForm = document.getElementById('addMaterialForm');
        const brandSelect = document.getElementById('brandSelect');
        const newBrandOther = document.getElementById('newBrandOther');
        const typeSelect = document.getElementById('typeSelect');
        const newTypeOther = document.getElementById('newTypeOther');
        const newSeries = document.getElementById('newSeries');
        const newColorPicker = document.getElementById('newColorPicker');
        const newColorText = document.getElementById('newColorText');
        const ralBtn = document.getElementById('ralBtn');
        const ralSearchBlock = document.getElementById('ralSearchBlock');
        const ralCodeInput = document.getElementById('ralCodeInput');
        const ralSearchBtn = document.getElementById('ralSearchBtn');
        const ralResult = document.getElementById('ralResult');
        const newPrice = document.getElementById('newPrice');
        const newWeight = document.getElementById('newWeight');
        const powerInput = document.getElementById('powerInput');
        const tariffInput = document.getElementById('tariffInput');
        const amortInput = document.getElementById('amortInput');
        const resetSettingsBtn = document.getElementById('resetSettings');

        function toggleOther(select, input) {
            if (select.value === 'other') {
                input.classList.remove('hidden'); input.focus();
            } else {
                input.classList.add('hidden'); input.value = '';
            }
        }
        brandSelect.addEventListener('change', () => toggleOther(brandSelect, newBrandOther));
        typeSelect.addEventListener('change', () => toggleOther(typeSelect, newTypeOther));

        newColorPicker.addEventListener('input', () => {
            newColorText.value = findClosestColorName(newColorPicker.value);
        });
        newColorText.addEventListener('change', () => {
            const val = newColorText.value.trim();
            if (/^#[0-9a-fA-F]{6}$/.test(val)) {
                newColorPicker.value = val;
                newColorText.value = findClosestColorName(val);
            }
        });
        ralBtn.addEventListener('click', () => {
            ralSearchBlock.classList.toggle('hidden');
            ralCodeInput.value = ''; ralResult.innerHTML = '';
        });
        ralSearchBtn.addEventListener('click', () => {
            const code = ralCodeInput.value.trim().toUpperCase();
            const found = ralColorsFull.find(c => c.code.replace('RAL ','') === code || c.code === `RAL ${code}`);
            if (found) {
                newColorPicker.value = found.hex;
                newColorText.value = `${found.name} (${found.code})`;
                ralResult.innerHTML = `✅ Найден: ${found.code} ${found.name}`;
            } else {
                ralResult.innerHTML = `❌ RAL ${code} не найден`;
            }
        });

        function renderMaterialsList() {
            materialsListDiv.innerHTML = '';
            settings.materials.forEach((mat, index) => {
                const ppg = (mat.pricePerPackage / mat.packageWeight).toFixed(3);
                const colorName = getColorName(mat);
                const div = document.createElement('div'); div.className = 'material-item';
                div.innerHTML = `
                    <div class="material-info">
                        <span class="material-color" style="background:${mat.color||'#ccc'}"></span>
                        <strong>${mat.brand} ${mat.type} ${mat.series}</strong>
                        <span style="color:${mat.color||'#ccc'}"> (${colorName})</span><br>
                        <small>Цена: ${mat.pricePerPackage} Br / ${mat.packageWeight} г (≈${ppg} Br/г)</small>
                    </div>
                    <div>
                        <button class="edit-material small" data-index="${index}">✏️</button>
                        <button class="delete-material small danger" data-index="${index}">🗑️</button>
                    </div>`;
                materialsListDiv.appendChild(div);
            });
            document.querySelectorAll('.delete-material').forEach(b => {
                b.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    settings.materials.splice(idx,1);
                    saveSettings(settings);
                    renderMaterialsList();
                    updateCustomMaterialSelect();
                });
            });
            document.querySelectorAll('.edit-material').forEach(b => {
                b.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    const m = settings.materials[idx];
                    if (customBrands.includes(m.brand)) {
                        brandSelect.value = m.brand; newBrandOther.classList.add('hidden');
                    } else {
                        brandSelect.value = 'other'; newBrandOther.classList.remove('hidden'); newBrandOther.value = m.brand;
                    }
                    if (customTypes.includes(m.type)) {
                        typeSelect.value = m.type; newTypeOther.classList.add('hidden');
                    } else {
                        typeSelect.value = 'other'; newTypeOther.classList.remove('hidden'); newTypeOther.value = m.type;
                    }
                    newSeries.value = m.series || '';
                    newColorPicker.value = m.color || '#ff0000';
                    newColorText.value = m.color || '';
                    newPrice.value = m.pricePerPackage;
                    newWeight.value = m.packageWeight;
                    addMaterialForm.style.display = 'block';
                    addMaterialForm.dataset.editIndex = idx;
                });
            });
        }

        function saveMaterial() {
            let brand = brandSelect.value;
            if (brand === 'other') brand = newBrandOther.value.trim();
            let type = typeSelect.value;
            if (type === 'other') type = newTypeOther.value.trim();
            const series = newSeries.value.trim();
            const color = newColorText.value.trim() || newColorPicker.value;
            const price = parseFloat(newPrice.value);
            const weight = parseFloat(newWeight.value);
            if (!brand || !type || isNaN(price) || price<=0 || isNaN(weight) || weight<=0) {
                alert('Заполните бренд, тип, цену и вес корректно.');
                return;
            }
            const material = { brand, type, series, color, pricePerPackage: price, packageWeight: weight };
            const editIdx = addMaterialForm.dataset.editIndex;
            if (editIdx !== undefined && editIdx !== '') {
                settings.materials[editIdx] = material;
            } else {
                settings.materials.push(material);
                incrementUsage('brandUsage', brand); brandUsage = getUsage('brandUsage');
                incrementUsage('typeUsage', type); typeUsage = getUsage('typeUsage');
                if (!customBrands.includes(brand)) { customBrands.push(brand); saveBrands(); }
                if (!customTypes.includes(type)) { customTypes.push(type); saveTypes(); }
                populateBrandSelect(); populateTypeSelect();
            }
            saveSettings(settings);
            brandSelect.value = ''; newBrandOther.classList.add('hidden'); newBrandOther.value='';
            typeSelect.value = ''; newTypeOther.classList.add('hidden'); newTypeOther.value='';
            newSeries.value = ''; newColorPicker.value = '#ff0000'; newColorText.value = '';
            newPrice.value = '30'; newWeight.value = '1000';
            addMaterialForm.style.display = 'none';
            delete addMaterialForm.dataset.editIndex;
            renderMaterialsList();
            updateCustomMaterialSelect();
        }

        function loadGlobalParamsToForm() {
            powerInput.value = settings.power;
            tariffInput.value = settings.tariff;
            amortInput.value = settings.amortization;
        }
        function saveGlobalParams() {
            settings.power = parseFloat(powerInput.value) || 0.15;
            settings.tariff = parseFloat(tariffInput.value) || 0.25;
            settings.amortization = parseFloat(amortInput.value) || 10.0;
            saveSettings(settings);
            recalculate();
        }
        [powerInput, tariffInput, amortInput].forEach(inp => inp.addEventListener('change', saveGlobalParams));

        resetSettingsBtn.addEventListener('click', () => {
            if (confirm('Сбросить все настройки и материалы?')) {
                ['printCalcSettings','customBrands','customTypes','brandUsage','typeUsage','ordersArchive'].forEach(k => localStorage.removeItem(k));
                customBrands = [...DEFAULT_BRANDS]; customTypes = [...DEFAULT_TYPES];
                brandUsage = {}; typeUsage = {};
                saveBrands(); saveTypes();
                settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
                saveSettings(settings);
                loadGlobalParamsToForm();
                renderBrandsList(); renderTypesList();
                populateBrandSelect(); populateTypeSelect();
                updateCustomMaterialSelect();
                renderMaterialsList();
                parts = []; renderParts(); recalculate();
                alert('Настройки сброшены.');
            }
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                const panel = document.getElementById('panel-' + tab.dataset.tab);
                panel.classList.add('active');
                if (tab.dataset.tab === 'materials') renderMaterialsList();
                if (tab.dataset.tab === 'settings') loadGlobalParamsToForm();
                if (tab.dataset.tab === 'dictionaries') { renderBrandsList(); renderTypesList(); }
            });
        });

        document.getElementById('showAddMaterial').addEventListener('click', () => {
            populateBrandSelect(); populateTypeSelect();
            addMaterialForm.style.display = 'block';
            delete addMaterialForm.dataset.editIndex;
            brandSelect.value = ''; newBrandOther.classList.add('hidden'); newBrandOther.value='';
            typeSelect.value = ''; newTypeOther.classList.add('hidden'); newTypeOther.value='';
            newSeries.value = ''; newColorPicker.value = '#ff0000'; newColorText.value = '';
            newPrice.value = '30'; newWeight.value = '1000';
            ralSearchBlock.classList.add('hidden');
        });
        document.getElementById('saveNewMaterial').addEventListener('click', saveMaterial);
        document.getElementById('cancelAddMaterial').addEventListener('click', () => {
            addMaterialForm.style.display = 'none'; delete addMaterialForm.dataset.editIndex;
        });
        document.getElementById('addBrandBtn').addEventListener('click', () => {
            const newBrand = document.getElementById('newBrandInput').value.trim();
            if (newBrand && !customBrands.includes(newBrand)) {
                customBrands.push(newBrand); saveBrands(); renderBrandsList(); populateBrandSelect();
                document.getElementById('newBrandInput').value = '';
            }
        });
        document.getElementById('addTypeBtn').addEventListener('click', () => {
            const newType = document.getElementById('newTypeInput').value.trim();
            if (newType && !customTypes.includes(newType)) {
                customTypes.push(newType); saveTypes(); renderTypesList(); populateTypeSelect();
                document.getElementById('newTypeInput').value = '';
            }
        });
        document.getElementById('sortByType').addEventListener('click', sortByType);
        document.getElementById('addPartBtn').addEventListener('click', addPart);
        document.getElementById('saveOrderBtn').addEventListener('click', saveOrder);
        document.getElementById('loadOrderBtn').addEventListener('click', loadArchive);
        document.getElementById('sendBtn').addEventListener('click', () => {
            if (!tg?.sendData) { alert('Только внутри Telegram'); return; }
            const orderName = document.getElementById('orderName').value.trim() || 'Без названия';
            const data = {
                order: orderName,
                parts: parts.map(p => ({
                    material: `${p.mat.brand} ${p.mat.type}`,
                    weight: p.weight, time: p.time
                })),
                final_price: document.getElementById('result').dataset.finalPrice + ' Br'
            };
            tg.sendData(JSON.stringify(data));
            tg.showPopup({ title: 'Готово', message: `Заказ "${orderName}" отправлен.` });
        });
        document.getElementById('shareBtn').addEventListener('click', () => {
            const text = generateShareText();
            if (navigator.share) {
                navigator.share({ title: 'Расчёт 3D-печати', text: text });
            } else {
                navigator.clipboard.writeText(text).then(() => alert('Скопировано.'));
            }
        });
        function generateShareText() {
            const orderName = document.getElementById('orderName').value.trim() || 'Без названия';
            let text = `📊 Заказ: ${orderName}\n`;
            parts.forEach(p => {
                const ppg = (p.mat.pricePerPackage / p.mat.packageWeight).toFixed(3);
                text += `▪ ${p.mat.brand} ${p.mat.type} — ${p.weight}г × ${ppg} Br/г\n`;
            });
            text += `💰 Итого: ${document.getElementById('result').dataset.finalPrice} Br`;
            return text;
        }

        marginSelect.addEventListener('change', recalculate);
        populateBrandSelect();
        populateTypeSelect();
        updateCustomMaterialSelect();
        renderMaterialsList();
        renderParts();
        recalculate();
    </script>
</body>
</html>
